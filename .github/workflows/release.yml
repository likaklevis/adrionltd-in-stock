name: Build extension release

on:
  push:
    # After updating manifest.json, a matching tag (e.g. v1.0.1) publishes the ZIP.
    tags: ['v*']
  # Manual runs build a downloadable ZIP only; they do not publish a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('manifest.json', 'utf8'));
          if (
            typeof version !== 'string' ||
            !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
            version.split('.').some((part) => Number(part) > 65535) ||
            version === '0.0.0'
          ) {
            throw new Error('manifest.json must have a three-part browser version, such as 1.0.1.');
          }
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag must match manifest.json: expected v${version}.`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Build and verify the extension ZIP
        run: |
          node --check content.js
          python3 <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source_manifest = json.loads(Path('manifest.json').read_text())
          files = ['manifest.json', 'content.js', 'LICENSE', *sorted(set(source_manifest['icons'].values()))]
          output = Path('dist/adrionltd-in-stock.zip')
          output.parent.mkdir(exist_ok=True)
          with ZipFile(output, 'w', compression=ZIP_DEFLATED) as archive:
              for filename in files:
                  archive.write(filename, arcname=filename)
          with ZipFile(output) as archive:
              assert sorted(archive.namelist()) == sorted(files), 'Unexpected ZIP contents'
              assert archive.testzip() is None, 'Corrupt ZIP'
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['version'] == json.loads(Path('manifest.json').read_text())['version']
              for script in manifest['content_scripts']:
                  for filename in script['js']:
                      assert filename in archive.namelist(), f'Missing content script: {filename}'
              for filename in manifest['icons'].values():
                  assert filename in archive.namelist(), f'Missing extension icon: {filename}'
          print(f'Built {output} with version {manifest["version"]}.')
          PY

      - name: Save the extension ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ steps.version.outputs.version }}
          path: dist/adrionltd-in-stock.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/adrionltd-in-stock.zip \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
